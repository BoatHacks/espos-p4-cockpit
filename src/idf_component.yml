## Override transitive esp_hosted dependency.
##
## SensESP's esp_wifi_remote 1.5.1 declares "espressif/esp_hosted: >=2.11",
## which resolved to 2.12.3 when our dependencies.lock was first generated
## and stays locked there. Pinning a stricter version here forces the
## component manager to re-resolve to 2.12.7 (the most stable release we
## have tested with the cockpit workload).
##
## 2.12.8 (incl. SPIRAM mempool knob) was tested 2026-05-23 and does
## NOT fix the streaming-class wedge from espressif/esp-hosted-mcu#197.
## Tested both `MEMPOOL_PREFER_SPIRAM=y` and `=n`; both wedge in <20s
## under sustained 500 KB/s inbound TCP, while 2.12.7 holds for ~13min.
## Pinning to exact 2.12.7 since `~2.12.7` resolved upward to 2.12.8.
dependencies:
  espressif/esp_hosted:
    version: "==2.12.7"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  # Used by the /screenshot endpoint to return JPEG instead of raw 16-bit
  # BMP. BMP is ~1.2 MB at 1024x600 and takes ~6 s over esp_hosted SDIO,
  # making it unusable for the designer's live-mirror mode. JPEG drops
  # the wire size to ~30-50 KB and the encode time to well under a
  # second on P4 (no hardware JPEG today; this is the software encoder,
  # but it's small enough for our 1-2 fps poll budget).
  espressif/esp_new_jpeg:
    version: "^1.0.0"
