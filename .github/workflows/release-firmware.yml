name: Release merged firmware

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      libs-ref:
        description: >-
          Git ref to check the sister libs out at (branch, tag, or SHA).
          Empty uses each repo's default branch. Pin this to reproduce an
          older release's exact firmware.
        required: false
        default: ""
  # Also a build gate: the sister libs are symlinked, so a break here
  # would otherwise stay hidden until a release is cut.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sensesp-p4-cockpit
        uses: actions/checkout@v4
        with:
          path: sensesp-p4-cockpit

      # platformio.ini pulls these in as symlink:// lib_deps, so they
      # must land as siblings of sensesp-p4-cockpit on disk.
      - name: Check out sensesp-cockpit-display
        uses: actions/checkout@v4
        with:
          repository: dirkwa/sensesp-cockpit-display
          ref: ${{ inputs.libs-ref }}
          path: sensesp-cockpit-display

      - name: Check out sensesp-n2k-gateway
        uses: actions/checkout@v4
        with:
          repository: dirkwa/sensesp-n2k-gateway
          ref: ${{ inputs.libs-ref }}
          path: sensesp-n2k-gateway

      - name: Check out sensesp-ble-gateway
        uses: actions/checkout@v4
        with:
          repository: dirkwa/sensesp-ble-gateway
          ref: ${{ inputs.libs-ref }}
          path: sensesp-ble-gateway

      - name: Check out sensesp-wyoming-satellite
        uses: actions/checkout@v4
        with:
          repository: dirkwa/sensesp-wyoming-satellite
          ref: ${{ inputs.libs-ref }}
          path: sensesp-wyoming-satellite

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: esptool 5 renamed merge_bin -> merge-bin and dropped the
      # esptool.py entry point, so an unpinned install breaks this silently.
      # PlatformIO must stay >= 6.1.18 — the pioarduino platform refuses to
      # install on older cores.
      - name: Install PlatformIO + esptool
        run: pip install "platformio==6.1.19" "esptool==4.8.1"

      - name: Build firmware (p4_cockpit)
        working-directory: sensesp-p4-cockpit
        run: pio run -e p4_cockpit

      # --require-model: the default env wakes on-device (WakeNet hiesp),
      # so a merged image without the model partition would boot with a
      # dead wake word. Fail the build instead of shipping that.
      - name: Merge flash images into one binary
        working-directory: sensesp-p4-cockpit
        run: |
          python scripts/merge_firmware.py \
            --build-dir .pio/build/p4_cockpit \
            --chip esp32p4 \
            --require-model \
            --out sensesp-p4-cockpit-merged.bin

      # Cheap guard against a silently-truncated or partial merge: the
      # image must start at 0x0, carry the ESP magic byte, and extend
      # past the model partition at 0xE10000.
      - name: Verify merged binary
        working-directory: sensesp-p4-cockpit
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          img = Path("sensesp-p4-cockpit-merged.bin")
          data = img.read_bytes()
          size = len(data)
          print(f"{img}: {size} bytes ({size / 1024 / 1024:.2f} MiB)")

          # Bootloader lands at 0x2000 for the P4 and starts with 0xE9.
          if data[0x2000] != 0xE9:
              sys.exit(f"error: no ESP image magic at 0x2000 "
                       f"(got {data[0x2000]:#04x})")
          # The model partition is the last thing merged in; if it were
          # skipped the image would stop well short of its 0xE10000 offset.
          if size <= 0xE10000:
              sys.exit(f"error: image is {size:#x} bytes, which does not "
                       f"reach the model partition at 0xE10000 — the "
                       f"WakeNet model was not merged")
          print("merged image looks structurally sound")
          PY

      - name: Upload merged binary to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: sensesp-p4-cockpit/sensesp-p4-cockpit-merged.bin

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: merged-firmware
          path: sensesp-p4-cockpit/sensesp-p4-cockpit-merged.bin
